<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
    <title>云语面板卷轴开发指南 | Scroll Dev Guide</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- 移动端侧边栏全屏遮罩 -->
        <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="d-flex align-items-center">
                    <div class="sidebar-logo me-2">
                        <i class="fa-solid fa-scroll text-purple"></i>
                    </div>
                    <div>
                        <h5 class="m-0 fw-bold tracking-tight" id="sidebar-title">卷轴开发手册</h5>
                        <div class="text-muted small" style="font-size: 0.68rem;">Scroll Dev Guide</div>
                    </div>
                </div>
                <button class="sidebar-close-btn d-lg-none" id="sidebar-close" aria-label="关闭侧边栏">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="sidebar-content">
                <nav class="nav flex-column" id="toc-nav">
                </nav>
            </div>
            <div class="sidebar-footer">
                <div class="d-flex flex-column gap-2">
                    <a href="../scrolls-market.html">
                        <i class="fa-solid fa-store text-purple"></i>
                        <span>浏览卷轴商店</span>
                    </a>
                    <a href="../">
                        <i class="fa-solid fa-arrow-left"></i>
                        <span>返回官网首页</span>
                    </a>
                </div>
            </div>
        </aside>

        <main class="main-container" id="main-container">
            <header class="mobile-header">
                <button class="btn-toggle me-2" id="sidebar-toggle" aria-label="打开侧边栏">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="mobile-brand">
                    <i class="fa-solid fa-scroll text-purple"></i>
                    <span>卷轴指南</span>
                </div>
                <div class="d-flex align-items-center gap-2 ms-auto">
                    <a href="../scrolls-market.html" class="btn btn-sm btn-outline-secondary py-1 px-2 text-decoration-none" style="font-size: 0.78rem; border-color: var(--c-border); color: var(--c-text-secondary);">
                        <i class="fa-solid fa-store me-1"></i>商店
                    </a>
                    <a href="../" class="btn btn-sm btn-outline-secondary py-1 px-2 text-decoration-none" style="font-size: 0.78rem; border-color: var(--c-border); color: var(--c-text-secondary);">
                        <i class="fa-solid fa-house me-1"></i>官网
                    </a>
                </div>
            </header>

            <div class="lang-switch">
                <div class="btn-group shadow-sm bg-surface rounded-pill p-1">
                    <button class="btn btn-sm rounded-pill px-3 active" id="btn-zh">中文</button>
                    <button class="btn btn-sm rounded-pill px-3" id="btn-en">EN</button>
                </div>
            </div>

            <div class="content-wrapper">
                <div id="doc-content">
                </div>
            </div>
        </main>
    </div>

    <!-- 全局轻量 Toast 提示 -->
    <div class="doc-toast" id="doc-toast">
        <i class="fa-solid fa-check text-success"></i>
        <span id="doc-toast-msg">已复制到剪贴板</span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
    <script src="js/content.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
