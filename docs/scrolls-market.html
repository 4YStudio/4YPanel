<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <title>4YPanel - 卷轴市场</title>
    <meta name="description" content="浏览、搜索和获取 4YPanel 自动化卷轴脚本，免侵入提升你的 Minecraft 服务器管理体验。">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/landing.css?v=2.6.0">
    <link rel="stylesheet" href="css/market.css?v=2">
</head>
<body>
    <div class="nav-backdrop" id="navBackdrop"></div>
    <nav class="navbar scrolled" id="navbar">
        <div class="container nav-container">
            <a href="./index.html" class="nav-brand">
                <div class="nav-logo">
                    <i class="fa-solid fa-cube"></i>
                </div>
                <div class="nav-brand-group">
                    <span class="nav-brand-text">4YPanel</span>
                    <span class="nav-brand-badge">v2.6.3</span>
                </div>
            </a>
            <div class="nav-links" id="navLinks">
                <div class="nav-links-header">
                    <div class="nav-brand-group">
                        <span class="nav-brand-text">导航菜单</span>
                    </div>
                    <button class="nav-close-btn" id="navCloseBtn" aria-label="Close menu">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <a href="./index.html#architectures" class="nav-item">
                    <i class="fa-solid fa-layer-group"></i> 架构与特性
                </a>
                <a href="./index.html#scrolls" class="nav-item">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> 卷轴系统
                </a>
                <a href="./index.html#quickstart" class="nav-item">
                    <i class="fa-solid fa-rocket"></i> 快速开始
                </a>
                <a href="./market.html" class="nav-item nav-link-market">
                    <i class="fa-solid fa-puzzle-piece"></i> 插件市场
                </a>
                <a href="./scrolls-market.html" class="nav-item nav-link-scrolls" style="background: rgba(192, 132, 252, 0.12); color: #c084fc !important;">
                    <i class="fa-solid fa-scroll"></i> 卷轴市场
                </a>
                <div class="nav-dropdown">
                    <button class="nav-item nav-dropdown-btn" id="navDocsBtn" type="button">
                        <i class="fa-solid fa-book-bookmark"></i> 开发文档 <i class="fa-solid fa-chevron-down nav-dropdown-arrow"></i>
                    </button>
                    <div class="nav-dropdown-menu">
                        <a href="./scrolls-guide/" class="dropdown-item">
                            <i class="fa-solid fa-scroll" style="color: #c084fc;"></i>
                            <div class="dropdown-item-text">
                                <span class="dropdown-title">卷轴开发手册</span>
                                <span class="dropdown-sub">原版免端模组的脚本引擎</span>
                            </div>
                        </a>
                        <a href="./dev-guide/" class="dropdown-item">
                            <i class="fa-solid fa-code" style="color: #60a5fa;"></i>
                            <div class="dropdown-item-text">
                                <span class="dropdown-title">插件开发指南</span>
                                <span class="dropdown-sub">模块化全栈插件开发标准</span>
                            </div>
                        </a>
                    </div>
                </div>
                <a href="https://github.com/4YStudio/4YPanel" target="_blank" class="nav-item nav-link-github">
                    <i class="fa-brands fa-github"></i> GitHub
                </a>
            </div>
            <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>

    <!-- Hero / Header Area -->
    <header class="market-hero">
        <div class="market-hero-bg">
            <div class="market-hero-grid"></div>
            <div class="market-hero-glow"></div>
        </div>
        <div class="container market-hero-content">
            <div class="market-hero-badge">
                <i class="fa-solid fa-scroll"></i>
                <span>官方与社区卷轴市场</span>
            </div>
            <h1 class="market-hero-title">全核心通用的自动化脚本</h1>
            <p class="market-hero-desc">免安装服务端 Mod/Plugin、永不崩服、零侵入式的 Minecraft 控制台自动化脚本库。一键导入，毫秒级热生效！</p>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="market-main container">
        <!-- Controls: Search & Category Filters & Order -->
        <section class="controls-panel">
            <div class="search-wrapper">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" placeholder="搜索卷轴名称、功能描述或作者..." aria-label="搜索卷轴">
            </div>
            <div class="filters-and-sort">
                <div class="category-filters" id="categoryFilters">
                    <button class="filter-btn active" data-category="all">全部</button>
                    <button class="filter-btn" data-category="tools">系统运维</button>
                    <button class="filter-btn" data-category="interactive">玩家互动</button>
                    <button class="filter-btn" data-category="utility">实用工具</button>
                </div>
                <div class="sort-wrapper">
                    <label for="sortSelect" class="sort-label">排序方式</label>
                    <div class="select-container">
                        <select id="sortSelect">
                            <option value="default">默认推荐</option>
                            <option value="name">按名称 (A-Z)</option>
                            <option value="category">按分类排序</option>
                        </select>
                        <i class="fa-solid fa-chevron-down select-chevron"></i>
                    </div>
                </div>
            </div>
        </section>

        <!-- Loading Indicator / Empty State -->
        <div class="market-status" id="marketStatus" style="display: none;">
            <div class="empty-state">
                <i class="fa-solid fa-scroll empty-icon"></i>
                <p>未找到符合条件的卷轴脚本</p>
                <button class="btn btn-outline btn-sm" id="resetFiltersBtn">重置过滤条件</button>
            </div>
        </div>

        <!-- Scrolls Grid -->
        <section class="plugins-grid-container" id="scrollsGrid">
            <!-- Cards will be populated by JavaScript -->
        </section>
    </main>

    <!-- Scroll Details Dialog -->
    <dialog class="details-modal" id="detailsModal">
        <div class="modal-content">
            <button class="modal-close" id="modalCloseBtn" aria-label="关闭">&times;</button>
            <div class="modal-body" id="modalBody">
                <!-- Modal content will be generated dynamically -->
            </div>
        </div>
    </dialog>

    <!-- Toast Notification -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-brand">
                    <div class="nav-logo">
                        <i class="fa-solid fa-cube"></i>
                    </div>
                    <span class="footer-brand-text">4YPanel</span>
                </div>
                <div class="footer-links">
                    <a href="./index.html#features">特性</a>
                    <a href="./index.html#screenshots">截图</a>
                    <a href="./index.html#quickstart">快速开始</a>
                    <a href="./market.html">插件市场</a>
                    <a href="./scrolls-market.html">卷轴市场</a>
                    <a href="./scrolls-guide/">卷轴开发文档</a>
                    <a href="./dev-guide/">插件开发文档</a>
                    <a href="https://github.com/4YStudio/4YPanel" target="_blank">GitHub</a>
                </div>
            </div>
            <div class="footer-bottom">
                <p>Released under the <a href="https://github.com/4YStudio/4YPanel/blob/main/LICENSE" target="_blank">MIT License</a></p>
                <p>Made with <i class="fa-solid fa-heart" style="color: #ef4444;"></i> by <a href="https://github.com/4YStudio" target="_blank">4YStudio</a></p>
            </div>
        </div>
    </footer>

    <script src="js/landing.js?v=2"></script>
    <script src="js/scrolls-market.js?v=2"></script>
</body>
</html>
