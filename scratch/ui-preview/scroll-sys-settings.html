<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Scroll Sys Settings Preview</title>
    <link href="../../public/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../public/css/all.min.css">
    <link rel="stylesheet" href="../../public/css/style.css">
    <style>
        body { margin: 0; padding: 28px 18px; min-height: 100vh; background: var(--c-app-bg, #0b1020); }
        .preview-wrap { max-width: 600px; margin: 0 auto; }
        .scroll-sys-modal .modal-content { box-shadow: 0 24px 64px -16px rgba(0,0,0,.55); }
        .scroll-sys-option { opacity: 1; animation: none; }
    </style>
</head>
<body>
<div class="preview-wrap">
    <div class="modal fade show scroll-sys-modal" style="display:block; position:static; z-index:1;">
        <div class="modal-dialog my-0 mx-auto px-0" style="max-width: 560px;">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header border-0 pb-0 pt-3 pt-md-4 px-3 px-md-4 align-items-start">
                    <div class="pe-2">
                        <h5 class="modal-title fw-bold d-flex align-items-center gap-2">
                            <i class="fa-solid fa-sliders" style="color:#8b5cf6;"></i>
                            <span>卷轴系统设置</span>
                        </h5>
                        <div class="text-muted mt-1" style="font-size:.75rem; line-height:1.5;">
                            调整卷轴引擎对本实例的服务端行为，避免影响插件与模组功能
                        </div>
                    </div>
                    <button type="button" class="btn-close"></button>
                </div>
                <div class="modal-body px-3 px-md-4 py-3 py-md-4">
                    <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-2">
                        <h6 class="fw-bold mb-0 d-flex align-items-center gap-2" style="font-size:.85rem;">
                            <i class="fa-solid fa-terminal" style="color:#8b5cf6;"></i>
                            指令反馈策略
                        </h6>
                        <span class="badge rounded-pill" style="background:rgba(139,92,246,.14); color:#8b5cf6; font-size:.66rem; font-weight:600;">
                            <i class="fa-solid fa-cube me-1"></i>测试paper
                        </span>
                    </div>
                    <p class="text-muted mb-3" style="font-size:.75rem; line-height:1.6;">
                        卷轴引擎通过 gamerule sendCommandFeedback 静默后台指令回显。插件服与模组服若被强制静默，可能出现指令输出丢失、脚本或命令方块功能异常等问题。
                    </p>

                    <div class="scroll-sys-options">
                        <label class="scroll-sys-option is-active">
                            <input type="radio" name="fb" checked>
                            <span class="scroll-sys-option-icon"><i class="fa-solid fa-wand-magic-sparkles"></i></span>
                            <span class="flex-grow-1">
                                <span class="d-flex align-items-center gap-2 flex-wrap">
                                    <span class="scroll-sys-option-title">智能模式</span>
                                    <span class="badge rounded-pill" style="font-size:.6rem; font-weight:600; background:rgba(34,197,94,.15); color:#22c55e; border:1px solid rgba(34,197,94,.3);">推荐</span>
                                </span>
                                <span class="scroll-sys-option-desc d-block">仅当本实例存在已启用的卷轴时才静默指令反馈；未安装卷轴时完全保持服务器原版行为。</span>
                            </span>
                            <span class="scroll-sys-radio"></span>
                        </label>
                        <label class="scroll-sys-option">
                            <input type="radio" name="fb">
                            <span class="scroll-sys-option-icon"><i class="fa-solid fa-volume-xmark"></i></span>
                            <span class="flex-grow-1">
                                <span class="d-flex align-items-center gap-2 flex-wrap">
                                    <span class="scroll-sys-option-title">始终静默</span>
                                </span>
                                <span class="scroll-sys-option-desc d-block">无论是否安装卷轴都禁用指令反馈（旧版默认行为），仅推荐给单纯原版体验的服务器。</span>
                            </span>
                            <span class="scroll-sys-radio"></span>
                        </label>
                        <label class="scroll-sys-option">
                            <input type="radio" name="fb">
                            <span class="scroll-sys-option-icon"><i class="fa-solid fa-server"></i></span>
                            <span class="flex-grow-1">
                                <span class="d-flex align-items-center gap-2 flex-wrap">
                                    <span class="scroll-sys-option-title">交由服务器管理</span>
                                </span>
                                <span class="scroll-sys-option-desc d-block">面板完全不修改该项 gamerule，由服务器自身或插件控制，适合已自行配置的实例。</span>
                            </span>
                            <span class="scroll-sys-radio"></span>
                        </label>
                    </div>

                    <div class="alert alert-warning border-0 rounded-3 small mt-3 mb-0 d-flex align-items-start gap-2" style="font-size:.75rem; line-height:1.55;">
                        <i class="fa-solid fa-triangle-exclamation mt-1"></i>
                        <span>当前实例为 Paper 服务端，选择「始终静默」可能导致部分插件或模组的指令反馈与命令输出异常。</span>
                    </div>

                    <div class="mt-3">
                        <div class="text-muted mb-2 fw-semibold" style="font-size:.7rem; letter-spacing:.02em;">
                            <i class="fa-solid fa-gauge-high me-1"></i>当前运行状态
                        </div>
                        <div class="d-flex gap-2">
                            <div class="scroll-sys-stat">
                                <div class="scroll-sys-stat-label">已启用卷轴</div>
                                <div class="scroll-sys-stat-value">0</div>
                            </div>
                            <div class="scroll-sys-stat">
                                <div class="scroll-sys-stat-label">服务器</div>
                                <div class="scroll-sys-stat-value text-success">运行中</div>
                            </div>
                            <div class="scroll-sys-stat">
                                <div class="scroll-sys-stat-label">指令反馈</div>
                                <div class="scroll-sys-stat-value" style="color:#22c55e;">正常</div>
                            </div>
                        </div>
                    </div>

                    <div class="scroll-sys-note p-2 mt-3 d-flex align-items-start gap-2">
                        <i class="fa-solid fa-circle-info mt-1" style="color:#8b5cf6;"></i>
                        <span>保存后若服务器正在运行将立即生效，否则将在下次启动时自动应用。</span>
                    </div>
                </div>
                <div class="modal-footer border-0 pt-0 pb-3 pb-md-4 px-3 px-md-4">
                    <button type="button" class="btn btn-outline-secondary rounded-pill px-4">取消</button>
                    <button type="button" class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm">
                        <i class="fa-solid fa-check me-1"></i><span>保存并应用</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    if (location.hash === '#light') {
        document.documentElement.setAttribute('data-bs-theme', 'light');
        document.body.style.background = '#f1f5f9';
    }
</script>
</body>
</html>
